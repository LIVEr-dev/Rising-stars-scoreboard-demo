<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rising Stars Live - Admin Console</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container header-content">
      <div>
        <div class="header-title">⚡ Admin Console</div>
        <div class="header-subtitle">Tournament Control Panel</div>
      </div>
      <button class="btn btn-primary" onclick="openViewer()">
        👁️ Open Viewer
      </button>
    </div>
  </header>

  <main class="container" style="padding-top: 2rem; padding-bottom: 3rem;">
    <div class="tabs" style="display: flex; gap: 0; margin-bottom: 2rem;">
      <button class="tab active" onclick="switchTab('tournaments')">Tournaments</button>
      <button class="tab" onclick="switchTab('teams')">Teams</button>
      <button class="tab" onclick="switchTab('matches')">Matches</button>
      <button class="tab" onclick="switchTab('timer')">Match Timer</button>
    </div>

    <!-- Tournaments Tab -->
    <div id="tournaments-tab" class="tab-content">
      <div class="card">
        <h3 style="font-size: 1.25rem; margin-bottom: 1.5rem;">Create Tournament</h3>
        <form onsubmit="handleCreateTournament(event)">
          <div class="form-group">
            <label>Tournament Name</label>
            <input type="text" id="tournamentName" placeholder="e.g., Summer Championship 2026" required>
          </div>
          <div class="grid-2">
            <div class="form-group">
              <label>Sport</label>
              <select id="tournamentSport">
                <option value="soccer">⚽ Soccer</option>
                <option value="rugby">🏉 Rugby</option>
                <option value="hockey">🏒 Hockey</option>
              </select>
            </div>
            <div class="form-group">
              <label>Format</label>
              <select id="tournamentFormat">
                <option value="round-robin-single">Single Round Robin</option>
                <option value="round-robin-double">Double Round Robin</option>
              </select>
            </div>
          </div>
          <button type="submit" class="btn btn-success" style="width: 100%;">+ Create Tournament</button>
        </form>
      </div>

      <div class="card">
        <h3 style="font-size: 1.25rem; margin-bottom: 1.5rem;">Active Tournaments</h3>
        <div id="tournaments-list"></div>
      </div>
    </div>

    <!-- Teams Tab -->
    <div id="teams-tab" class="tab-content" style="display: none;">
      <div class="card">
        <h3 style="font-size: 1.25rem; margin-bottom: 1.5rem;">Select Tournament</h3>
        <select id="teamsTournamentSelect" onchange="updateTeamsTournament()">
          <option value="">Choose a tournament...</option>
        </select>
      </div>

      <div id="teams-container"></div>
    </div>

    <!-- Matches Tab -->
    <div id="matches-tab" class="tab-content" style="display: none;">
      <div class="card">
        <h3 style="font-size: 1.25rem; margin-bottom: 1.5rem;">Select Tournament</h3>
        <select id="matchesTournamentSelect" onchange="updateMatchesTournament()">
          <option value="">Choose a tournament...</option>
        </select>
      </div>

      <div id="matches-container"></div>
    </div>

    <!-- Timer Tab -->
    <div id="timer-tab" class="tab-content" style="display: none;">
      <div class="timer-container">
        <div class="timer-period" id="timerPeriodDisplay">Match Setup</div>
        <div class="timer-display" id="timerDisplay">00:00</div>
        <div class="timer-status" id="timerStatus">Ready to start</div>
      </div>

      <div class="card">
        <h3 style="font-size: 1.25rem; margin-bottom: 1.5rem;">Timer Configuration</h3>
        <form onsubmit="handleTimerConfig(event)">
          <div class="grid-2">
            <div class="form-group">
              <label>Mode</label>
              <select id="timerMode" onchange="updateTimerMode()">
                <option value="count-up">Count Up (Running Time)</option>
                <option value="count-down">Count Down (Time Remaining)</option>
              </select>
            </div>
            <div class="form-group">
              <label>Format</label>
              <select id="timerFormat" onchange="updateTimerFormat()">
                <option value="halves">Halves (2 periods)</option>
                <option value="quarters">Quarters (4 periods)</option>
              </select>
            </div>
          </div>

          <div class="grid-2">
            <div class="form-group">
              <label>Duration per Period (minutes)</label>
              <input type="number" id="timerDuration" value="45" min="1" onchange="updateTimerDuration()">
            </div>
            <div class="form-group">
              <label>Current Time (seconds)</label>
              <input type="number" id="timerCurrentTime" value="0" min="0" onchange="updateTimerCurrentTime()">
            </div>
          </div>

          <div class="form-group">
            <label>Current Period</label>
            <input type="number" id="timerCurrentPeriod" value="1" min="1" max="4" onchange="updateTimerPeriod()">
          </div>
        </form>
      </div>

      <div class="card">
        <h3 style="font-size: 1.25rem; margin-bottom: 1.5rem;">Timer Controls</h3>
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem;">
          <button class="btn btn-success" style="width: 100%;" onclick="startTimer()">▶ Start</button>
          <button class="btn btn-primary" style="width: 100%;" onclick="pauseTimer()">⏸ Pause</button>
          <button class="btn btn-primary" style="width: 100%;" onclick="resumeTimer()">▶ Resume</button>
          <button class="btn btn-danger" style="width: 100%;" onclick="stopTimer()">⏹ Stop</button>
        </div>
      </div>
    </div>
  </main>

  <script src="js/sync.js"></script>
  <script src="js/timer.js"></script>
  <script>
    let currentTournamentId = null;
    let currentTeamsTournamentId = null;
    let currentMatchesTournamentId = null;

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
      document.getElementById(tabName + '-tab').style.display = 'block';
      event.target.classList.add('active');
    }

    function openViewer() {
      window.open('index.html', 'viewer', 'width=1200,height=800');
    }

    // ===== TOURNAMENTS =====
    function handleCreateTournament(e) {
      e.preventDefault();
      const name = document.getElementById('tournamentName').value;
      const sport = document.getElementById('tournamentSport').value;
      const format = document.getElementById('tournamentFormat').value;

      dataSync.createTournament({ name, sport, format });
      document.getElementById('tournamentName').value = '';
      refreshTournaments();
    }

    function refreshTournaments() {
      const data = dataSync.getData();
      const list = document.getElementById('tournaments-list');

      if (data.tournaments.length === 0) {
        list.innerHTML = '<p style="color: #94a3b8;">No tournaments created yet</p>';
        document.getElementById('teamsTournamentSelect').innerHTML = '<option value="">Choose a tournament...</option>';
        document.getElementById('matchesTournamentSelect').innerHTML = '<option value="">Choose a tournament...</option>';
        return;
      }

      list.innerHTML = data.tournaments.map(t => `
        <div class="card" style="background: rgba(30, 41, 59, 0.3); border: 1px solid rgba(148, 163, 184, 0.1);">
          <div style="display: flex; justify-content: space-between; align-items: start;">
            <div>
              <h4 style="margin-bottom: 0.5rem;">${t.name}</h4>
              <p style="color: #94a3b8; font-size: 0.875rem;">${t.sport} • ${(t.teams || []).length} Teams • ${(t.matches || []).length} Matches</p>
            </div>
            <button class="btn btn-danger" onclick="deleteTournament('${t.id}')">Delete</button>
          </div>
        </div>
      `).join('');

      // Update select options
      const selects = ['teamsTournamentSelect', 'matchesTournamentSelect'];
      selects.forEach(selectId => {
        document.getElementById(selectId).innerHTML = data.tournaments.map(t =>
          `<option value="${t.id}">${t.name}</option>`
        ).join('');
      });
    }

    function deleteTournament(id) {
      if (confirm('Are you sure?')) {
        const data = dataSync.getData();
        dataSync.setData({
          ...data,
          tournaments: data.tournaments.filter(t => t.id !== id)
        });
        refreshTournaments();
      }
    }

    // ===== TEAMS =====
    function updateTeamsTournament() {
      const id = document.getElementById('teamsTournamentSelect').value;
      currentTeamsTournamentId = id;
      renderTeamsSection();
    }

    function renderTeamsSection() {
      const data = dataSync.getData();
      const tournament = data.tournaments.find(t => t.id === currentTeamsTournamentId);
      const container = document.getElementById('teams-container');

      if (!tournament) {
        container.innerHTML = '';
        return;
      }

      let html = `
        <div class="card">
          <h3 style="font-size: 1.25rem; margin-bottom: 1.5rem;">Add Team</h3>
          <form onsubmit="handleAddTeam(event)">
            <div class="form-group">
              <label>Team Name</label>
              <input type="text" id="teamName" placeholder="e.g., Rising Stars Red" required>
            </div>
            <button type="submit" class="btn btn-success" style="width: 100%;">+ Add Team</button>
          </form>
        </div>

        <div class="card">
          <h3 style="font-size: 1.25rem; margin-bottom: 1.5rem;">Teams (${(tournament.teams || []).length})</h3>
          <div style="display: grid; gap: 1rem;">
      `;

      (tournament.teams || []).forEach(team => {
        html += `
          <div style="background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(148, 163, 184, 0.1); border-radius: 0.5rem; padding: 1rem; display: flex; justify-content: space-between; align-items: center;">
            <div>
              <div style="font-weight: 600;">${team.name}</div>
              <div style="color: #94a3b8; font-size: 0.875rem;">ID: ${team.id}</div>
            </div>
            <button class="btn btn-danger" onclick="deleteTeam('${tournament.id}', '${team.id}')">Delete</button>
          </div>
        `;
      });

      html += '</div></div>';
      container.innerHTML = html;
    }

    function handleAddTeam(e) {
      e.preventDefault();
      if (!currentTeamsTournamentId) return;

      const name = document.getElementById('teamName').value;
      const data = dataSync.getData();
      const tournament = data.tournaments.find(t => t.id === currentTeamsTournamentId);

      if (tournament) {
        tournament.teams = tournament.teams || [];
        tournament.teams.push({
          id: `team_${Date.now()}`,
          name,
          logo: null
        });
        dataSync.setData(data);
        document.getElementById('teamName').value = '';
        renderTeamsSection();
      }
    }

    function deleteTeam(tournamentId, teamId) {
      if (confirm('Delete this team?')) {
        const data = dataSync.getData();
        const tournament = data.tournaments.find(t => t.id === tournamentId);
        if (tournament) {
          tournament.teams = tournament.teams.filter(t => t.id !== teamId);
          dataSync.setData(data);
          renderTeamsSection();
        }
      }
    }

    // ===== MATCHES =====
    function updateMatchesTournament() {
      const id = document.getElementById('matchesTournamentSelect').value;
      currentMatchesTournamentId = id;
      renderMatchesSection();
    }

    function renderMatchesSection() {
      const data = dataSync.getData();
      const tournament = data.tournaments.find(t => t.id === currentMatchesTournamentId);
      const container = document.getElementById('matches-container');

      if (!tournament) {
        container.innerHTML = '';
        return;
      }

      if ((tournament.teams || []).length < 2) {
        container.innerHTML = '<div class="card"><p style="color: #94a3b8;">Add at least 2 teams first</p></div>';
        return;
      }

      let html = `
        <div class="card">
          <h3 style="font-size: 1.25rem; margin-bottom: 1.5rem;">Create Match</h3>
          <form onsubmit="handleCreateMatch(event)">
            <div class="grid-2">
              <div class="form-group">
                <label>Home Team</label>
                <select id="matchHome" required>
                  <option value="">Select...</option>
                  ${tournament.teams.map(t => `<option value="${t.id}">${t.name}</option>`).join('')}
                </select>
              </div>
              <div class="form-group">
                <label>Away Team</label>
                <select id="matchAway" required>
                  <option value="">Select...</option>
                  ${tournament.teams.map(t => `<option value="${t.id}">${t.name}</option>`).join('')}
                </select>
              </div>
            </div>
            <button type="submit" class="btn btn-success" style="width: 100%;">+ Create Match</button>
          </form>
        </div>

        <div class="card">
          <h3 style="font-size: 1.25rem; margin-bottom: 1.5rem;">Matches (${(tournament.matches || []).length})</h3>
          <div style="display: grid; gap: 1rem;">
      `;

      (tournament.matches || []).forEach(match => {
        const homeTeam = tournament.teams.find(t => t.id === match.homeTeamId);
        const awayTeam = tournament.teams.find(t => t.id === match.awayTeamId);

        html += `
          <div style="background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(148, 163, 184, 0.1); border-radius: 0.5rem; padding: 1rem;">
            <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 1rem;">
              <div>
                <div style="font-weight: 600; margin-bottom: 0.25rem;">${homeTeam?.name || 'Unknown'} vs ${awayTeam?.name || 'Unknown'}</div>
                <div style="color: #94a3b8; font-size: 0.875rem;">${match.status}</div>
              </div>
              <button class="btn btn-primary" onclick="openMatchEditor('${tournament.id}', '${match.id}')">Edit Score</button>
            </div>
            <div style="display: flex; gap: 1rem; align-items: center;">
              <div style="font-size: 2rem; font-weight: bold;">${match.homeScore}</div>
              <div style="color: #94a3b8;">-</div>
              <div style="font-size: 2rem; font-weight: bold;">${match.awayScore}</div>
            </div>
          </div>
        `;
      });

      html += '</div></div>';
      container.innerHTML = html;
    }

    function handleCreateMatch(e) {
      e.preventDefault();
      if (!currentMatchesTournamentId) return;

      const homeId = document.getElementById('matchHome').value;
      const awayId = document.getElementById('matchAway').value;

      if (!homeId || !awayId || homeId === awayId) {
        alert('Select two different teams');
        return;
      }

      const data = dataSync.getData();
      const tournament = data.tournaments.find(t => t.id === currentMatchesTournamentId);

      if (tournament) {
        tournament.matches = tournament.matches || [];
        tournament.matches.push({
          id: `match_${Date.now()}`,
          homeTeamId: homeId,
          awayTeamId: awayId,
          homeScore: 0,
          awayScore: 0,
          status: 'scheduled',
          date: new Date().toISOString()
        });
        dataSync.setData(data);
        renderMatchesSection();
      }
    }

    function openMatchEditor(tournamentId, matchId) {
      const data = dataSync.getData();
      const tournament = data.tournaments.find(t => t.id === tournamentId);
      const match = tournament.matches.find(m => m.id === matchId);
      const homeTeam = tournament.teams.find(t => t.id === match.homeTeamId);
      const awayTeam = tournament.teams.find(t => t.id === match.awayTeamId);

      const modal = document.createElement('div');
      modal.className = 'modal open';
      modal.innerHTML = `
        <div class="modal-content">
          <div class="modal-header">
            <h3>${homeTeam.name} vs ${awayTeam.name}</h3>
            <button class="modal-close" onclick="this.closest('.modal').remove()">✕</button>
          </div>

          <form onsubmit="handleUpdateMatch(event, '${tournamentId}', '${matchId}')">
            <div class="grid-2">
              <div class="form-group">
                <label>${homeTeam.name} Score</label>
                <input type="number" id="homeScoreInput" value="${match.homeScore}" min="0" required>
              </div>
              <div class="form-group">
                <label>${awayTeam.name} Score</label>
                <input type="number" id="awayScoreInput" value="${match.awayScore}" min="0" required>
              </div>
            </div>

            <div class="form-group">
              <label>Match Status</label>
              <select id="matchStatusInput">
                <option value="scheduled" ${match.status === 'scheduled' ? 'selected' : ''}>Scheduled</option>
                <option value="live" ${match.status === 'live' ? 'selected' : ''}>Live</option>
                <option value="completed" ${match.status === 'completed' ? 'selected' : ''}>Completed</option>
              </select>
            </div>

            <button type="submit" class="btn btn-success" style="width: 100%;">Update Match</button>
          </form>
        </div>
      `;

      document.body.appendChild(modal);
      modal.addEventListener('click', (e) => {
        if (e.target === modal) modal.remove();
      });
    }

    function handleUpdateMatch(e, tournamentId, matchId) {
      e.preventDefault();
      const homeScore = parseInt(document.getElementById('homeScoreInput').value);
      const awayScore = parseInt(document.getElementById('awayScoreInput').value);
      const status = document.getElementById('matchStatusInput').value;

      const data = dataSync.getData();
      const tournament = data.tournaments.find(t => t.id === tournamentId);
      const match = tournament.matches.find(m => m.id === matchId);

      if (match) {
        match.homeScore = homeScore;
        match.awayScore = awayScore;
        match.status = status;
        dataSync.setData(data);
        renderMatchesSection();
        document.querySelector('.modal').remove();
      }
    }

    // ===== TIMER =====
    function updateTimerMode() {
      const mode = document.getElementById('timerMode').value;
      matchTimer.configure({ mode });
      updateTimerDisplay();
    }

    function updateTimerFormat() {
      const format = document.getElementById('timerFormat').value;
      matchTimer.configure({ format });
      updateTimerDisplay();
    }

    function updateTimerDuration() {
      const duration = parseInt(document.getElementById('timerDuration').value) * 60;
      matchTimer.configure({ totalDuration: duration });
    }

    function updateTimerCurrentTime() {
      const time = parseInt(document.getElementById('timerCurrentTime').value);
      matchTimer.setCurrentTime(time);
      updateTimerDisplay();
    }

    function updateTimerPeriod() {
      const period = parseInt(document.getElementById('timerCurrentPeriod').value);
      matchTimer.setCurrentPeriod(period);
      updateTimerDisplay();
    }

    function startTimer() {
      matchTimer.start();
      syncTimerToData();
    }

    function pauseTimer() {
      matchTimer.pause();
      syncTimerToData();
    }

    function resumeTimer() {
      matchTimer.resume();
      syncTimerToData();
    }

    function stopTimer() {
      matchTimer.stop();
      syncTimerToData();
    }

    function syncTimerToData() {
      const timerData = {
        isRunning: matchTimer.isRunning,
        isPaused: matchTimer.config.isPaused,
        currentTime: matchTimer.config.currentTime,
        currentPeriod: matchTimer.config.currentPeriod,
        formattedTime: matchTimer.getFormattedTime(),
        periodLabel: matchTimer.getPeriodLabel()
      };
      dataSync.setTimer(timerData);
    }

    function updateTimerDisplay() {
      document.getElementById('timerDisplay').textContent = matchTimer.getFormattedTime();
      document.getElementById('timerPeriodDisplay').textContent = matchTimer.getPeriodLabel();
      syncTimerToData();
    }

    // Subscribe to timer changes
    matchTimer.subscribe(() => {
      updateTimerDisplay();
    });

    // Setup timer auto-sync
    setInterval(() => {
      if (matchTimer.isRunning) {
        syncTimerToData();
      }
    }, 100);

    // Initial render
    refreshTournaments();
  </script>
</body>
</html>
